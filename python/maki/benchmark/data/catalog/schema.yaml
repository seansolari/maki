# datasets.yaml
#
# Minimal dataset manifest specification.
# This file describes publicly available datasets and the files needed
# to download and validate them.

schema_version: "1.0"

datasets:
  - id: "unique_dataset_id"
    name: "Human-readable dataset name"
    description: "Short description of the dataset"

    # Broad classification
    domain: "metagenomics"              # e.g. metagenomics, genomics, transcriptomics
    data_type: "shotgun_metagenomics"   # e.g. shotgun_metagenomics, amplicon, reference_genomes, variants
    assay: "illumina_paired_end"        # optional; use null if not applicable

    # Biological/source context
    organism: "mixed microbial community"  # optional; use null if not applicable
    source: "public"                       # e.g. public, institutional, user_provided
    license: "CC-BY-4.0"                   # optional but recommended

    # Flexible metadata block.
    # Add domain-specific fields here without changing the top-level schema.
    metadata:
      project: "Example project name"
      accession: "Example accession or null"
      biome: "human gut"
      host: "Homo sapiens"
      sample_type: "stool"
      platform: "Illumina"
      read_layout: "paired"              # e.g. single, paired, long_read
      taxonomic_scope: "microbial community"
      tags:
        - "test"
        - "small"
        - "shotgun"

    # One or more downloadable files.
    files:
      - role: "reads_1"                  # e.g. reads_1, reads_2, fasta, gff, metadata_table
        url: "https://example.org/sample_R1.fastq.gz"
        filename: "sample_R1.fastq.gz"
        size_bytes: 123456789            # optional but recommended

        checksum:
          algorithm: "sha256"            # recommended: sha256
          value: "expected_checksum_here"

      - role: "reads_2"
        url: "https://example.org/sample_R2.fastq.gz"
        filename: "sample_R2.fastq.gz"
        size_bytes: 123456790

        checksum:
          algorithm: "sha256"
          value: "expected_checksum_here"