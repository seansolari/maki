[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "maki"
version = "2.0.3"
description = "Metagenomics using an Annotated K-mer Index"
authors = [{name="Sean Solari"}]

dependencies = [
    "typer",
    "tqdm",
    "requests",
    "ete4",
    "sourmash>=4.9,<5",
    "sourmash_plugin_branchwater",
]

[project.optional-dependencies]
benchmark = [
    "psutil>=6.0"
]

benchmark-cloud = [
    "psutil>=6.0",
    "azure-storage-blob>=12.0"
]

[tool.scikit-build]
wheel.packages = ["python/maki"]
cmake.build-type = "Release"
logging.level = "INFO"

[project.scripts]
"maki" = "maki.cli:main"
"maki-buildwf" = "maki.workflows.buildstages:main"
"maki-classifywf" = "maki.workflows.classifystages:main"
"maki-atb" = "maki.atb.cli:main"
