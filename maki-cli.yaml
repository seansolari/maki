
tool: maki
version: 2.0.0
global_env:
  MYTOOL_CACHE_DIR: "./.cache"

subcommands:
  index:
    description: "index a collection of genome sequences"
    inputs:
      - name: manifest
        type: file
        required: true
    outputs:
      - name: database
        type: directory
    args:
      - name:
          - "-t"
          - "--threads"
        type: unsigned int
        description: "Number of threads to use for indexing"
        default: auto-detect
        required: false
      - name:
          - "-R"
          - "--ram-gb"
        type: long double
        description: "RAM limit"
        default: null
        required: false
      - name:
          - "-b"
          - "--bulk"
        type: flag
        description: "Force bulk indexing strategy"
        default: false
        required: false
      - name:
          - "-s"
          - "--suffix-size"
        type: unsigned int
        description: "Force indexing with this suffix size"
        default: null
        required: false
      - name:
          - "-q"
          - "--qf"
        type: string
        description: "Path to query file containing genomes to index"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "Path to save database"
        default: null
        required: true
      - name:
          - "-k"
          - "--kmer"
        type: unsigned int
        description: "K-mer size"
        default: null
        required: true
      - name:
          - "-l"
          - "--log"
        type: string
        description: "File to write logs"
        default: null
        required: false
      - name:
          - "-F"
          - "--force"
        type: flag
        description: "Force overwrite of existing database"
        default: false
        required: false
    examples:
      - "maki index -q genomes.txt -o ~/DATA/database -t 64 -k 31 -b"
      - "maki index -q genomes.txt -o ~/DATA/database -t 64 -k 31 -s 4"
      - "maki index -q genomes.txt -o ~/DATA/database -t 64 -k 31 -R 300 -l logs.txt"
    exit_success: 0
  dbstats:
    description: "Print basic database statistics"
    inputs:
      - name: database
        type: directory
        required: true
    outputs: null
    args:
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: false
    examples:
      - "maki dbstats -i ~/DATA/database"
    exit_success: 0
  make-filter:
    description: "create a filter database (input is FASTA read from STDIN)"
    inputs:
      - name: filter_sequence
        type: file
        required: true
    outputs:
      - name: filter_database
        type: directory
    args:
      - name:
          - "-t"
          - "--threads"
        type: unsigned int
        description: "Number of threads to use for indexing"
        default: auto-detect
        required: false
      - name:
          - "-R"
          - "--ram-gb"
        type: long double
        description: "RAM limit"
        default: null
        required: false
      - name:
          - "-b"
          - "--bulk"
        type: flag
        description: "Force bulk indexing strategy"
        default: false
        required: false
      - name:
          - "-s"
          - "--suffix-size"
        type: unsigned int
        description: "Force indexing with this suffix size"
        default: null
        required: false
      - name:
          - "-o"
          - "--out"
        type: string
        description: "Path to save database"
        default: null
        required: true
      - name:
          - "-k"
          - "--kmer"
        type: unsigned int
        description: "K-mer size"
        default: null
        required: true
      - name:
          - "-l"
          - "--log"
        type: string
        description: "File to write logs"
        default: null
        required: false
      - name:
          - "-F"
          - "--force"
        type: flag
        description: "Force overwrite of existing database"
        default: false
        required: false
    examples:
      - "cat genome.fna | maki make_filter -o ~/DATA/filter -t 64 -k 31 -b"
      - "cat genome.fna | maki make_filter -o ~/DATA/filter -t 64 -k 31 -s 4"
      - "cat genome.fna | maki make_filter -o ~/DATA/filter -t 64 -k 31 -R 300 -l logs.txt"
    exit_success: 0
  classify:
    description: "analyse collection of short reads using a database"
    inputs:
      - name: database
        type: directory
        required: true
      - name: sample-manifest
        type: file
        required: true    
    outputs:
      - name: sample-results
        type: directory
    args:
      - name:
          - "-t"
          - "--threads"
        type: unsigned int
        description: "Number of threads to use for indexing"
        default: auto-detect
        required: false
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-r"
          - "--rf"
        type: string
        description: "Path to query file containing reads"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "Path to analysis output"
        default: null
        required: true
      - name:
          - "-L"
          - "--min-length"
        type: unsigned int
        description: "Minimum read length"
        default: 100
        required: false
      - name:
          - "-R"
          - "--ram-gb"
        type: long double
        description: "RAM limit"
        default: null
        required: false
      - name:
          - "-b"
          - "--bulk"
        type: flag
        description: "Force bulk indexing strategy"
        default: false
        required: false
      - name:
          - "-s"
          - "--suffix-size"
        type: unsigned int
        description: "Force indexing with this suffix size"
        default: null
        required: false
      - name:
          - "-l"
          - "--log"
        type: string
        description: "File to write logs"
        default: null
        required: false
    examples:
      - "maki classify -i ~/DATA/database -t 64 -r ~/INPUT/paired-reads.txt -o ~/OUTPUT/paired-reads-results -L 150"
    exit_success: 0
  dist:
    description: "compute shared k-mers between genomes using a database"
    inputs:
      - name: database
        type: directory
        required: true
    outputs:
      - name: shared-kmers
        type: file
    args:
      - name:
          - "-t"
          - "--threads"
        type: unsigned int
        description: "Number of threads to use for distance calculation"
        default: auto-detect
        required: false
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-l"
          - "--log"
        type: string
        description: "File to write logs"
        default: null
        required: false
      - name:
          - "-z"
          - "--temp-dir"
        type: string
        description: "Folder to use for temporary data"
        default: null
        required: false
    examples:
      - "maki dist -i ~/DATA/database -t 64 -o ~/OUTPUT/genome-distances.txt.gz"
    exit_success: 0
  count:
    description: "count unique k-mers in genomes"
    inputs:
      - name: database
        type: directory
        required: true
    outputs:
      - name: unique-kmers
        type: file
    args:
      - name:
          - "-t"
          - "--threads"
        type: unsigned int
        description: "Number of threads to use for counting"
        default: auto-detect
        required: false
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-l"
          - "--log"
        type: string
        description: "File to write logs"
        default: null
        required: false
      - name:
          - "-W"
          - "--whole"
        type: flag
        description: "Calculate distance between whole genomes, not features"
        default: false
        required: false
    examples:
      - "maki count -i ~/DATA/database -t 64 -o ~/OUTPUT/genome-distances.genes.txt.gz"
      - "maki count -i ~/DATA/database -t 64 -W -o ~/OUTPUT/genome-distances.genomes.txt.gz"
    exit_success: 0
  subcount:
    description: "count unique k-mers in subsets of total"
    inputs:
      - name: database
        type: directory
        required: true
    outputs:
      - name: subsampled-kmer-count
        type: file
    args:
      - name:
          - "-t"
          - "--threads"
        type: unsigned int
        description: "Number of threads to use for counting"
        default: auto-detect
        required: false
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-l"
          - "--log"
        type: string
        description: "File to write logs"
        default: null
        required: false
      - name:
          - "-X"
          - "--subsamples"
        type: string
        description: "Comma-separated number of genomes per subsample"
        default: null
        required: true
      - name:
          - "-r"
          - "--repeats"
        type: unsigned int
        description: "Number of repeats per subsample size"
        default: 3
        required: false
    examples:
      - "maki subcount -i ~/DATA/database -t 64 -r 3 -X 100,1000,10000 -o ~/OUTPUT/subcount.txt.gz"
    exit_success: 0
  jaccard:
    description: "Calculate Jaccard index, p-values and metadata"
    inputs:
      - name: database
        type: directory
        required: true
      - name: shared-kmers
        type: file
        required: true
      - name: unique-kmers
        type: file
        required: true
      - name: phylogeny
        type: file
        required: true
    outputs:
      - name: jaccard-summary
        type: file
    args:
      - name:
          - "-t"
          - "--tree"
        type: string
        description: "Path to reference phylogeny"
        default: null
        required: true
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-c"
          - "--count"
        type: string
        description: "Count output"
        default: null
        required: true
      - name:
          - "-d"
          - "--dist"
        type: string
        description: "Dist output"
        default: null
        required: true
      - name:
          - "-r"
          - "--take"
        type: unsigned int
        description: "Number of random records to output per rank"
        default: null
        required: false
      - name:
          - "-a"
          - "--alpha"
        type: float
        description: "Significance level for r1 CI"
        default: 0.05
        required: false
    examples:
      - "maki jaccard -i ~/DATA/database -t ~/INPUT/genome-tree.nwk -c ~/OUTPUT/genome-distances.genomes.txt.gz -d ~/OUTPUT/genome-distances.genomes.txt.gz -r 1000 -o ~/OUTPUT/jaccard.sample1000.txt.gz"
      - "maki jaccard -i ~/DATA/database -t ~/INPUT/genome-tree.nwk -c ~/OUTPUT/genome-distances.genomes.txt.gz -d ~/OUTPUT/genome-distances.genomes.txt.gz -o ~/OUTPUT/jaccard.txt.gz"
    exit_success: 0
  compress1:
    description: "count oc-occurring k-mers"
    inputs:
      - name: database
        type: directory
        required: true
    outputs:
      - name: cooccurring-kmer-count
        type: file
    args:
      - name:
          - "-t"
          - "--threads"
        type: unsigned int
        description: "Number of threads to use for counting"
        default: auto-detect
        required: false
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-l"
          - "--log"
        type: string
        description: "File to write logs"
        default: null
        required: false
    examples:
      - "maki compress1 -i ~/DATA/database -t 64 -o ~/OUTPUT/cooc.k31.txt.gz"
    exit_success: 0
  lca1:
    description: "calculate phylogenetic conservation of k-mers"
    inputs:
      - name: database
        type: directory
        required: true
      - name: cooccurring-kmer-count
        type: file
        required: true
      - name: phylogeny
        type: file
        required: true
    outputs:
      - name: cooccurring-kmer-count-summary
        type: file
    args:
      - name:
          - "-t"
          - "--tree"
        type: string
        description: "Path to reference phylogeny"
        default: null
        required: true
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-c"
          - "--count"
        type: string
        description: "compress1 output"
        default: null
        required: true
    examples:
      - "maki lca1 -i ~/DATA/database -t ~/INPUT/genome-tree.nwk -c ~/OUTPUT/cooc.k31.txt.gz -o ~/OUTPUT/cooc.k31.lca1.txt.gz"
    exit_success: 0
  glca1:
    description: "calculate conservation of genes"
    inputs:
      - name: database
        type: directory
        required: true
      - name: cluster-manifest
        type: file
        required: true
      - name: phylogeny
        type: file
        required: true
    outputs:
      - name: cluster-summary
        type: file
    args:
      - name:
          - "-t"
          - "--tree"
        type: string
        description: "Path to reference phylogeny"
        default: null
        required: true
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-g"
          - "--cluster"
        type: string
        description: "Cluster file contains 2 tab-separated columns: [representative] [member]"
        default: null
        required: true
    examples:
      - "maki glca1 -i ~/DATA/database -t ~/INPUT/genome-tree.nwk --cluster ~/INPUT/genome-groups.txt.gz -o ~/OUTPUT/cooc.k31.lca1.txt.gz"
    exit_success: 0
  randist:
    description: "sample a feature distance among every pair of genomes"
    inputs:
      - name: database
        type: directory
        required: true
      - name: cluster-manifest
        type: file
        required: true
      - name: unique-kmers
        type: file
        required: true
      - name: phylogeny
        type: file
        required: true
    outputs:
      - name: feature-table
        type: file
    args:
      - name:
          - "-t"
          - "--tree"
        type: string
        description: "Path to reference phylogeny"
        default: null
        required: true
      - name:
          - "-i"
          - "--db"
        type: string
        description: "Path to database"
        default: null
        required: true
      - name:
          - "-o"
          - "--out"
        type: string
        description: "File to save results"
        default: null
        required: true
      - name:
          - "-g"
          - "--cluster"
        type: string
        description: "Cluster file contains 2 tab-separated columns: [representative] [member]"
        default: null
        required: true
      - name:
          - "-c"
          - "--count"
        type: string
        description: "Count output"
        default: null
        required: true
      - name:
          - "-a"
          - "--alpha"
        type: float
        description: "Significance level for r1 CI"
        default: 0.05
        required: false
    examples:
      - "maki randist -i ~/DATA/database -t ~/INPUT/genome-tree.nwk --cluster ~/INPUT/genome-groups.txt.gz -c ~/OUTPUT/cooc.k31.txt.gz -o ~/OUTPUT/genes.txt.gz"
    exit_success: 0

pipelines:
  jaccard:
    description: "Compute Jaccard Index between genome sequences"
    steps:
      - subcommand: index
        map:
          manifest: params.genomes
        args:
          "--threads": params.threads
          "--ram-gb": params.ram_limit
          "--qf": manifest
          "--out": params.index_path
          "--kmer": params.kmer_size
        outmap:
          database: ch_database
      - subcommand: count
        map:
          database: ch_database
        args:
          "--threads": params.threads
          "--db": database
          "--out": unique-kmers
          "-W": true
        outmap:
          unique-kmers: ch_unique_genome_kmers
      - subcommand: dist
        map:
          database: ch_database
        args:
          "--threads": params.threads
          "--db": database
          "--out": shared-kmers
        outmap:
          shared-kmers: ch_shared_genome_kmers
      - subcommand: jaccard
        map:
          database: ch_database
          shared-kmers: ch_shared_genome_kmers
          unique-kmers: ch_unique_genome_kmers
          phylogeny: params.phylogeny
        args:
          "--tree": phylogeny
          "--db": database
          "--out": jaccard-summary
          "--count": unique-kmers
          "--dist": shared-kmers
          "--take": params.jaccard_sample
        outmap:
          jaccard-summary: params.jaccard
  random_gene_distances:
    description: "Compute local Jaccard Index between annotated regions of genomes"
    steps:
      - subcommand: index
        map:
          manifest: params.genomes
        args:
          "--threads": params.threads
          "--ram-gb": params.ram_limit
          "--qf": manifest
          "--out": params.index_path
          "--kmer": params.kmer_size
        outmap:
          database: ch_database
      - subcommand: count
        map:
          database: ch_database
        args:
          "--threads": params.threads
          "--db": database
          "--out": unique-kmers
          "-W": false
        outmap:
          unique-kmers: ch_gene_kmers
      - subcommand: randist
        map:
          database: ch_database
          cluster-manifest: params.cluster_file
          unique-kmers: ch_gene_kmers
          phylogeny: params.phylogeny
        args:
          "--tree": phylogeny
          "--db": database
          "--out": feature-table
          "--cluster": cluster-manifest
          "--count": unique-kmers
        outmap:
          feature-table: params.gene_features
  kmer_prevalence:
    description: "Tabulate prevalence of k-mers"
    steps:
      - subcommand: index
        map:
          manifest: params.genomes
        args:
          "--threads": params.threads
          "--ram-gb": params.ram_limit
          "--qf": manifest
          "--out": params.index_path
          "--kmer": params.kmer_size
        outmap:
          database: ch_database
      - subcommand: compress1
        map:
          database: ch_database
        args:
          "--threads": params.threads
          "--db": database
          "--out": cooccurring-kmer-count
        outmap:
          cooccurring-kmer-count: params.cooc_output
      - subcommand: lca1
        map:
          database: ch_database
          cooccurring-kmer-count: params.cooc_output
          phylogeny: params.phylogeny
        args:
          "--tree": phylogeny
          "--db": database
          "--out": cooccurring-kmer-count-summary
          "--count": cooccurring-kmer-count
        outmap:
          cooccurring-kmer-count-summary: params.cooc_summary
